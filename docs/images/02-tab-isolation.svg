<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">ct-codex terminal tab isolation</title>
  <desc id="description">Two terminal tabs each attach to their own isolated tmux session and track their own Codex usage.</desc>
  <rect width="1600" height="900" fill="#020617"/>
  <text x="800" y="104" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="43" font-weight="700">One terminal tab, one Codex tmux session</text>
  <text x="800" y="146" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="24">Open several tabs without merging their work or token telemetry.</text>
  <rect x="112" y="220" width="624" height="490" rx="22" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
  <rect x="864" y="220" width="624" height="490" rx="22" fill="#0f172a" stroke="#a78bfa" stroke-width="3"/>
  <circle cx="150" cy="258" r="9" fill="#fb7185"/><circle cx="180" cy="258" r="9" fill="#fbbf24"/><circle cx="210" cy="258" r="9" fill="#34d399"/>
  <circle cx="902" cy="258" r="9" fill="#fb7185"/><circle cx="932" cy="258" r="9" fill="#fbbf24"/><circle cx="962" cy="258" r="9" fill="#34d399"/>
  <text x="424" y="265" text-anchor="middle" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="22">iTerm tab · api</text>
  <text x="1176" y="265" text-anchor="middle" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="22">iTerm tab · docs</text>
  <text x="154" y="342" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="23">$ ct codex</text>
  <text x="154" y="387" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="20">tmux: ct-codex-ttys002-4182</text>
  <text x="154" y="454" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="21">› Implement the API endpoint</text>
  <text x="906" y="342" fill="#a78bfa" font-family="ui-monospace, monospace" font-size="23">$ ct codex</text>
  <text x="906" y="387" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="20">tmux: ct-codex-ttys003-4239</text>
  <text x="906" y="454" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="21">› Write the bilingual README</text>
  <rect x="112" y="650" width="624" height="60" fill="#111827"/>
  <rect x="864" y="650" width="624" height="60" fill="#111827"/>
  <text x="136" y="688" fill="#34d399" font-family="ui-monospace, monospace" font-size="18">Context ███░░░░░░░░░ 22%  │  Uncached 248.4k</text>
  <text x="888" y="688" fill="#a78bfa" font-family="ui-monospace, monospace" font-size="18">Context █░░░░░░░░░░░ 7%   │  Uncached 61.9k</text>
  <path d="M736 448h128" stroke="#475569" stroke-width="3" stroke-dasharray="10 12"/>
  <circle cx="800" cy="448" r="44" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <path d="M780 428l40 40m0-40l-40 40" stroke="#fb7185" stroke-width="6" stroke-linecap="round"/>
  <text x="800" y="790" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="29" font-weight="700">No shared “codex” session</text>
  <text x="800" y="831" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="23">Re-run ct codex in a tab to reattach only to that tab’s persistent session.</text>
</svg>
